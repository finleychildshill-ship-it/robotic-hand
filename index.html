<!DOCTYPE html>
<html>
<head>
  <title>Hand Tracking</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
</head>
<body>
  <h2>Robotic Hand Control</h2>
  <button onclick="connectSerial()">Connect to Arduino</button>
  <p id="status">Not connected</p>
  <video id="video" autoplay playsinline style="display:none"></video>
  <canvas id="canvas" width="640" height="480"></canvas>

  <script>
    let writer;

    async function connectSerial() {
      const port = await navigator.serial.requestPort();
      await port.open({ baudRate: 9600 });
      writer = port.writable.getWriter();
      document.getElementById('status').innerText = 'Connected to Arduino!';
    }

    function getAngle(lm, tip, pip) {
      return lm[tip].y < lm[pip].y ? 180 : 0;
    }

    const hands = new Hands({locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
    hands.setOptions({ maxNumHands: 1, minDetectionConfidence: 0.7 });

    hands.onResults(results => {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(results.image, 0, 0);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const lm = results.multiHandLandmarks[0];
        drawConnectors(ctx, lm, HAND_CONNECTIONS, {color:'#00FF00', lineWidth:2});
        drawLandmarks(ctx, lm, {color:'#FF0000', lineWidth:1});

        const pinky  = getAngle(lm, 20, 18);
        const ring   = getAngle(lm, 16, 14);
        const middle = getAngle(lm, 12, 10);
        const index  = getAngle(lm, 8, 6);
        const thumb  = getAngle(lm, 4, 3);
        const palm   = 0;

        const data = `${pinky},${ring},${middle},${index},${thumb},${palm}\n`;
        if (writer) writer.write(new TextEncoder().encode(data));
      }
    });

    const video = document.getElementById('video');
    navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
      video.srcObject = stream;
      const camera = new Camera(video, {
        onFrame: async () => { await hands.send({image: video}); },
        width: 640, height: 480
      });
      camera.start();
    });
  </script>
</body>
</html>
