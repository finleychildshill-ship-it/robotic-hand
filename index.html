<!DOCTYPE html>
<html>
<head>
  <title>Hand Tracking</title>
</head>
<body>
  <h2>Robotic Hand Control</h2>
  <button onclick="connectWS()">Connect to Arduino</button>
  <p id="status">Not connected</p>
  <canvas id="canvas" width="640" height="480"></canvas>

  <script type="module">
    import vision from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/+esm";

    const { HandLandmarker, FilesetResolver } = vision;

    let ws;
    let handLandmarker;
    let video;

    window.connectWS = function() {
      ws = new WebSocket('ws://localhost:8765');
      ws.onopen = () => {
        document.getElementById('status').innerText = 'Connected to Arduino!';
      };
      ws.onerror = () => {
        document.getElementById('status').innerText = 'Connection failed!';
      };
    }

    async function setup() {
      const filesetResolver = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
      );
     handLandmarker = await HandLandmarker.createFromOptions(filesetResolver, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 1
      });
  

      video = document.createElement('video');
      video.autoplay = true;
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      video.srcObject = stream;
      await new Promise(r => video.onloadedmetadata = r);
      video.play();
      detect();
    }

    function getAngle(lm, tip, pip) {
      return lm[tip].y < lm[pip].y ? 180 : 0;
    }

    function detect() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const results = handLandmarker.detectForVideo(video, performance.now());

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      if (results.landmarks && results.landmarks.length > 0) {
        const lm = results.landmarks[0];

        const pinky  = getAngle(lm, 20, 18);
        const ring   = getAngle(lm, 16, 14);
        const middle = getAngle(lm, 12, 10);
        const index  = getAngle(lm, 8, 6);
        const thumb  = getAngle(lm, 4, 3);
        const palm   = 0;

        const data = `${pinky},${ring},${middle},${index},${thumb},${palm}\n`;
        if (ws && ws.readyState === 1) ws.send(data);
      }
      requestAnimationFrame(detect);
    }

    setup();
  </script>
</body>
</html>
